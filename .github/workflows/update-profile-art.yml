name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # Runs daily at ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Refresh contributions data
        run: |
          python scripts/fetch_contributions.py

      - name: Re-render animated heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit & push updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
